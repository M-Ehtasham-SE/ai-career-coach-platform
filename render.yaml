services:

  # ─── Backend: Spring Boot Web Service (Docker) ──────────────────────────────
  - type: web
    name: ai-career-coach-backend
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /api/v1/auth/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        value: postgresql://postgres:Aicareercoach1082@db.bwarslvfegnrwrzpdrno.supabase.co:5432/postgres
      - key: JWT_SECRET
        value: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

  # ─── Frontend: React Static Site ────────────────────────────────────────────
  - type: web
    name: ai-career-coach-frontend
    runtime: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://ai-career-coach-backend.onrender.com/api/v1
