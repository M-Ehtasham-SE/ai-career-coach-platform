services:

  # ─── Backend: Spring Boot Web Service ───────────────────────────────────────
  - type: web
    name: ai-career-coach-backend
    runtime: java
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -Dspring.profiles.active=prod -jar target/ai-career-coach-0.0.1-SNAPSHOT.jar
    healthCheckPath: /api/v1/auth/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: ai-career-coach-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false          # Set manually in Render dashboard
      - key: FRONTEND_URL
        sync: false          # Set after frontend is deployed

  # ─── Frontend: React Static Site ────────────────────────────────────────────
  - type: web
    name: ai-career-coach-frontend
    runtime: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false          # Set to https://ai-career-coach-backend.onrender.com/api/v1

# ─── PostgreSQL Database ─────────────────────────────────────────────────────
databases:
  - name: ai-career-coach-db
    region: singapore
    plan: free
    databaseName: ai_career_coach
    user: coach_user
