# ============================================
# Production Profile — application-prod.properties
# All values come from Render environment variables
# ============================================

# Server — Render injects PORT automatically
server.port=${PORT:8080}
server.servlet.context-path=/api/v1

# ============================================
# Database — Render / Cloud PostgreSQL
# ============================================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL}}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate — Auto-creates and updates database schema
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ============================================
# JWT Security
# ============================================
app.security.jwt-secret=${JWT_SECRET}
app.security.jwt-expiration=86400000

# ============================================
# OpenAI
# ============================================
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=${OPENAI_MODEL:gpt-4o-mini}
app.openai.url=https://api.openai.com/v1/chat/completions

# ============================================
# File Upload
# ============================================
app.upload.dir=/tmp/uploads/resumes
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ============================================
# Logging — quieter in prod
# ============================================
logging.level.com.aicareercoach=INFO
logging.level.org.springframework.security=WARN
